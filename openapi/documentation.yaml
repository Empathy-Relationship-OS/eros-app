        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /safety/reasons:
    get:
      summary: List report reasons
      description: The reasons a report or safety cancel can give, in display order. The app hard-codes no list.
      operationId: listSafetyReasons
      tags:
        - Safety
      responses:
        '200':
          description: The reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SafetyReason'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dates/{dateId}/report/evidence-url:
    post:
      summary: Get an evidence upload link
      description: |
        A presigned upload link for one image of evidence: JPEG, PNG or HEIC, up to 10 MB, with the
        size locked into the request. Upload with the returned `headers`, then pass `evidenceId` in
        `POST /dates/{dateId}/report`. At most 3 unattached uploads per person and date. The link
        lasts 15 minutes. Being built in CH-B8.
      operationId: createEvidenceUploadUrl
      tags:
        - Safety
      parameters:
        - $ref: '#/components/parameters/DateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceUploadRequest'
      responses:
        '200':
          description: The upload link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceUploadResponse'
        '400':
          description: An unsupported type, a file over 10 MB, or a fourth unattached upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Evidence uploads are turned off on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dates/{dateId}/report:
    post:
      summary: Report or cancel for safety
      description: |
        Reports the partner (`origin: REPORT`) or cancels the date on safety grounds
        (`origin: CANCEL`). Ends the date if it hasn't ended: contact stops at once and the pair
        can't match again. `yourRefund` says what happened to the caller's own deposit (RFC-006 §4.8).
        `description` is optional, at most 1,000 characters, and never logged. `evidenceIds` holds at
        most 3 ids from `POST /dates/{dateId}/report/evidence-url`.
      operationId: reportDate
      tags:
        - Safety
      parameters:
        - $ref: '#/components/parameters/DateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: The report was made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
        '400':
          description: An unknown `origin` or `reason`, a description over 1,000 characters, or a bad evidence id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            A second report by the same person on this date, a safety cancel on an ended date, or more
            than 30 days after a finished date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/me/devices:
    post:
      summary: Register a push device
      description: Saves an FCM token for the caller. Upserts by token, so a phone that changes account moves to the new user.
      operationId: registerDevice
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '204':
          description: Saved
        '400':
          description: A blank or over-long token, or an unknown platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/me/devices/remove:
    post:
      summary: Remove a push device
      description: Removes the token only if it belongs to the caller. Someone else's token, or one that isn't registered, is left alone.
      operationId: removeDevice
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveDeviceRequest'
      responses:
        '204':
          description: Removed, or nothing to remove
        '400':
          description: A blank or over-long token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

