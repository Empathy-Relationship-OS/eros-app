  # RFC-006 date chat (§5). Chat and safety routes need the USER role.
  /dates/{dateId}/chat:
    get:
      summary: Get chat status
      description: |
        The date chat's status, counts, partner and quick replies (RFC-006 §5). `status` comes from
        the one chat window rule (§4.1): the app reads it rather than working it out from the date's
        state. `closesAt` and `readableUntil` are null while `NOT_OPEN`; the counts are 0 while
        `NOT_OPEN` or `ARCHIVED`.
      operationId: getChatStatus
      tags:
        - Date chat
      parameters:
        - $ref: '#/components/parameters/DateId'
      responses:
        '200':
          description: The chat's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dates/{dateId}/chat/messages:
    get:
      summary: List chat messages
      description: |
        One page of messages, always in ascending `seq` order. Use `afterSeq` to catch up (newer
        messages), `beforeSeq` to scroll back (older ones), or neither for the latest page. Sending
        both is a 400. `seq` is the only cursor (D-18).
      operationId: listChatMessages
      tags:
        - Date chat
      parameters:
        - $ref: '#/components/parameters/DateId'
        - name: afterSeq
          in: query
          required: false
          description: Messages after this `seq`. 0 or more.
          schema:
            type: integer
            minimum: 0
        - name: beforeSeq
          in: query
          required: false
          description: Messages before this `seq`. 1 or more.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Page size. Larger values are capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagesPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The chat is `NOT_OPEN` or `ARCHIVED`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Send a chat message
      description: |
        Sends text or a quick reply: exactly one of `text` and `quickReplyKey`. Replaying a
        `clientMessageId` returns the original message with 200 and stores nothing (RFC-006 §4.4).
        Retries must reuse the same `clientMessageId`.
      operationId: sendChatMessage
      tags:
        - Date chat
      parameters:
        - $ref: '#/components/parameters/DateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
            examples:
              text:
                value:
                  clientMessageId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  text: Just parking
              quickReply:
                value:
                  clientMessageId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  quickReplyKey: ON_MY_WAY
      responses:
        '200':
          description: The stored message, or the original one for a replayed `clientMessageId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          description: |
            Empty, over 1,000 characters, both or neither of `text` and `quickReplyKey`, an unknown
            key, or a `clientMessageId` that isn't a UUID (`bad_request`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a participant, or banned (`forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The chat isn't `OPEN` (`conflict`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/MessageRejected'
        '429':
          $ref: '#/components/responses/ChatRateLimited'

  /dates/{dateId}/chat/read:
    post:
      summary: Mark chat messages read
      description: |
        Everything up to `seq` has been read. A `seq` at or below the stored position is a no-op.
        Allowed while `OPEN` or `CLOSED`.
      operationId: markChatRead
      tags:
        - Date chat
      parameters:
        - $ref: '#/components/parameters/DateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkChatReadRequest'
      responses:
        '204':
          description: Read position saved, or unchanged
        '400':
          description: A missing or negative `seq`, or one above `lastSeq`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The chat is `NOT_OPEN` or `ARCHIVED`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dates/{dateId}/chat/stream:
    get:
      summary: Live chat signals
      description: |
        A `text/event-stream` of signals while the chat is `OPEN` (RFC-006 §4.5). Signals carry only
        sequence numbers: the app fetches messages with `GET .../messages?afterSeq=` as always (D-17).

        | Event | Data | App does |
        |---|---|---|
        | `messages` | `{"lastSeq":19}` | Fetches `afterSeq` |
        | `read` | `{"partnerLastReadSeq":19}` | Updates "Seen" |
        | `closed` | `{}` | Refetches status and goes read-only |
        | `heartbeat` | none | Ignores it |

        A heartbeat is sent every 25 seconds. The stream ends after 50 minutes, or with `closed`
        within 30 seconds of the chat closing; reconnect and catch up with `afterSeq`. The checks run
        before the stream starts, so a chat that isn't open is a normal 409.
      operationId: streamChat
      tags:
        - Date chat
      parameters:
        - $ref: '#/components/parameters/DateId'
      responses:
        '200':
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: messages
                data: {"lastSeq":19}

                event: heartbeat
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The chat isn't `OPEN`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /dates/{dateId}/presence-status:
    get:
      summary: Get presence status
      description: Both participants' presence confirmations, as `confirm-presence` returns them (RFC-006 §2 defect 1).
      operationId: getPresenceStatus
      tags:
        - Dates
      parameters:
        - $ref: '#/components/parameters/DateId'
      responses:
        '200':
          description: Both participants' presence confirmations
          content:
