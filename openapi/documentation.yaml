openapi: 3.0.3
info:
  title: Eros Backend API
  description: |
    REST API for Project Eros - A dating application backend built with Ktor.

    ## Authentication
    All endpoints (except root `/`) require Firebase Authentication.
    Include the Firebase ID token in the Authorization header:
    ```
    Authorization: Bearer <firebase-id-token>
    ```

    ## Rate Limiting
    - Daily batch limit: 3 batches per day (21 total matches)
    - Token bucket: 100 capacity, 10s refill rate

  version: 0.0.1
  contact:
    name: Project Eros Team
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.eros.app
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: User Profiles
    description: User profile management
  - name: Photos
    description: User photo management with S3
  - name: Cities
    description: City and location endpoints
  - name: Preferences
    description: User matching preferences
  - name: Questions
    description: Question management (admin)
  - name: Q&A
    description: User question and answer responses
  - name: Matching
    description: Daily batch matching and actions
  - name: Dates
    description: Date lifecycle. The full dates contract is docs/dates-api-contract.yaml; only the RFC-006 additions are here.
  - name: Date chat
    description: Messaging between two people on a confirmed date (RFC-006)
  - name: Safety
    description: Reports and safety cancels (RFC-006)
  - name: Devices
    description: Push notification device tokens (RFC-006)
  - name: Safety admin
    description: Ops review of reports (RFC-006, ADMIN and EMPLOYEE)

security:
  - firebaseAuth: []

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token

  parameters:
    DateId:
      name: dateId
      in: path
      required: true
      description: The unique identifier for a date
      schema:
        type: integer
        format: int64
    ReportId:
      name: id
      in: path
      required: true
      description: A safety report's id
      schema:
        type: integer
        format: int64
    Uid:
      name: uid
      in: path
      required: true
      description: A user's Firebase uid
      schema:
        type: string

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
        status:
          type: integer
          description: HTTP status code
      required:
        - message
        - status

    UserProfile:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: User's Firebase UID
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, NON_BINARY, OTHER]
        cityId:
          type: string
          format: uuid
        bio:
          type: string
          maxLength: 500
        occupation:
          type: string
        education:
          type: string
        height:
          type: integer
          description: Height in centimeters
        status:
          type: string
          enum: [ACTIVE, SLEEP_MODE, BANNED, DELETED]
          description: Account status
        role:
          type: string
          enum: [USER, ADMIN, EMPLOYEE]
        elo:
          type: integer
          description: ELO rating for matching algorithm
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - firstName
        - lastName
        - dateOfBirth
        - gender
        - cityId
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, NON_BINARY, OTHER]
        cityId:
          type: string
          format: uuid
        bio:
          type: string
          maxLength: 500
        occupation:
          type: string
        education:
          type: string
        height:
          type: integer

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, NON_BINARY, OTHER]
        cityId:
          type: string
          format: uuid
        bio:
          type: string
          maxLength: 500
        occupation:
          type: string
        education:
          type: string
        height:
          type: integer

    City:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
        country:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time

    Photo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        isPrimary:
          type: boolean
        order:
          type: integer
        createdAt:
          type: string
          format: date-time

    PresignedUrlRequest:
      type: object
      required:
        - fileName
        - contentType
      properties:
        fileName:
          type: string
        contentType:
          type: string
          example: image/jpeg

    PresignedUrlResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
        photoKey:
          type: string
        expiresIn:
          type: integer

    ConfirmPhotoRequest:
      type: object
      required:
        - photoKey
      properties:
        photoKey:
          type: string

    UserPreference:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        ageMin:
          type: integer
          minimum: 18
          maximum: 100
        ageMax:
          type: integer
          minimum: 18
          maximum: 100
        maxDistance:
          type: integer
          minimum: 1
          maximum: 500
          description: Maximum distance in kilometers
        genderPreference:
          type: array
          maxItems: 4
          items:
            type: string
            enum: [MALE, FEMALE, NON_BINARY, OTHER]

    Question:
      type: object
      properties:
        id:
          type: string
          format: uuid
        questionText:
          type: string
        category:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserQA:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        answerText:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        targetUserId:
          type: string
          format: uuid
        action:
          type: string
          enum: [LIKE, PASS, PENDING]
        isMutual:
          type: boolean
        createdAt:
          type: string
          format: date-time

    DailyBatchResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/UserProfile'
          maxItems: 7
        batchNumber:
          type: integer
          description: Current batch number (1-3)
        remainingBatches:
          type: integer
          description: Remaining batches for today

    MatchActionRequest:
      type: object
      required:
        - liked
      properties:
        liked:
          type: boolean
          description: Whether the user liked the match (true) or passed (false)

    MutualMatchInfo:
      type: object
      properties:
        matchId:
          type: string
          format: uuid
        userProfile:
          $ref: '#/components/schemas/UserProfile'
        message:
          type: string

    ApiError:
      type: object
      description: The error body every RFC-006 route returns
      properties:
        error:
          type: string
          description: A stable code, e.g. `conflict`, `message_rejected`, `rate_limited`
        message:
          type: string
      required:
        - error
        - message

    # RFC-006 date chat (§5)
    ChatSummary:
      type: object
      description: The date's chat window (RFC-006 §4.1). The app shows the chat from this, never from `state`.
      required: [status]
      properties:
        status:
          type: string
          enum: [NOT_OPEN, OPEN, CLOSED, ARCHIVED]
        closesAt:
          type: string
          format: date-time
          nullable: true
          description: When the chat closes or closed. Null while `NOT_OPEN`.
        readableUntil:
          type: string
          format: date-time
          nullable: true
          description: When the chat is archived, 30 days after `closesAt`. Null while `NOT_OPEN`.
      example:
        status: OPEN
        closesAt: "2026-11-07T21:00:00Z"
        readableUntil: "2026-12-07T21:00:00Z"

    ChatStatus:
      type: object
      properties:
        dateId:
          type: integer
          format: int64
        status:
          type: string
          enum: [NOT_OPEN, OPEN, CLOSED, ARCHIVED]
          description: |
            `NOT_OPEN` until both confirm presence; `OPEN` until the date's scheduled end (or a
            cancel); `CLOSED` (readable, can't send) for 30 days; then `ARCHIVED`.
        closesAt:
          type: string
          format: date-time
          nullable: true
        readableUntil:
          type: string
          format: date-time
          nullable: true
        lastSeq:
          type: integer
        unreadCount:
          type: integer
        yourLastReadSeq:
          type: integer
        partnerLastReadSeq:
          type: integer
        partnerName:
          type: string
        partnerThumbnailUrl:
          type: string
          nullable: true
        quickReplies:
          type: array
          items:
            $ref: '#/components/schemas/QuickReply'
      example:
        dateId: 42
        status: OPEN
        closesAt: "2026-11-07T21:00:00Z"
        readableUntil: "2026-12-07T21:00:00Z"
        lastSeq: 18
        unreadCount: 2
        yourLastReadSeq: 16
        partnerLastReadSeq: 18
        partnerName: Alex
        partnerThumbnailUrl: https://cdn.example.com/photos/alex-thumb.jpg
        quickReplies:
          - key: ON_MY_WAY
            text: On my way

    QuickReply:
      type: object
      properties:
        key:
          type: string
          example: ON_MY_WAY
        text:
          type: string
          example: On my way

    ChatMessage:
      type: object
      properties:
        seq:
          type: integer
          description: The message's position in the chat, from 1. The only cursor.
        fromMe:
          type: boolean
        kind:
          type: string
          enum: [TEXT, QUICK_REPLY]
        quickReplyKey:
          type: string
          nullable: true
        text:
          type: string
          description: The message, or the quick reply's text
        contactDetected:
          type: boolean
          description: The text looks like it holds contact details (shown as a warning; not blocked)
        createdAt:
          type: string
          format: date-time
      example:
        seq: 17
        fromMe: false
        kind: TEXT
        quickReplyKey: null
        text: Just parking, 5 minutes
        contactDetected: false
        createdAt: "2026-11-07T18:58:03Z"

    ChatMessagesPage:
      type: object
      properties:
        messages:
          type: array
          description: Ascending `seq` order
          items:
            $ref: '#/components/schemas/ChatMessage'
        hasMore:
          type: boolean
          description: There are more messages beyond this page, in the direction of the cursor

    SendChatMessageRequest:
      type: object
      required: [clientMessageId]
      description: Exactly one of `text` and `quickReplyKey`.
      properties:
        clientMessageId:
          type: string
          format: uuid
          description: Made by the app; reused on every retry of this message
        text:
          type: string
          maxLength: 1000
        quickReplyKey:
          type: string
          description: A `key` from `quickReplies`

    MarkChatReadRequest:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          minimum: 0
          example: 18

    PresenceConfirmationStatus:
      type: object
      properties:
        dateId:
          type: integer
          format: int64
        user1:
          $ref: '#/components/schemas/ParticipantPresence'
        user2:
          $ref: '#/components/schemas/ParticipantPresence'

    ParticipantPresence:
      type: object
      properties:
        userId:
          type: string
        confirmed:
          type: boolean
        confirmedAt:
          type: string
          format: date-time
          nullable: true

    SafetyReason:
      type: object
      properties:
        code:
          type: string
          enum: [FEELS_UNSAFE, THREATENING, HARASSMENT, SEXUAL_CONTENT, FAKE_PROFILE, OTHER]
        label:
          type: string
          example: I feel unsafe

    EvidenceUploadRequest:
      type: object
      required: [contentType, fileSizeBytes]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/heic]
        fileSizeBytes:
          type: integer
          format: int64
          maximum: 10485760
          example: 123456

    EvidenceUploadResponse:
      type: object
      properties:
        evidenceId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          description: Presigned PUT link
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the upload must send
          example:
            Content-Type: image/jpeg
        expiresAt:
          type: string
          format: date-time

    ReportRequest:
      type: object
      required: [origin, reason]
      properties:
        origin:
          type: string
          enum: [REPORT, CANCEL]
        reason:
          type: string
          enum: [FEELS_UNSAFE, THREATENING, HARASSMENT, SEXUAL_CONTENT, FAKE_PROFILE, OTHER]
        description:
          type: string
          nullable: true
          maxLength: 1000
        evidenceIds:
          type: array
          maxItems: 3
          items:
            type: string
            format: uuid
      example:
        origin: REPORT
        reason: HARASSMENT
        description: They kept messaging after I asked them to stop
        evidenceIds: []

    ReportResult:
      type: object
      properties:
        reportId:
          type: integer
          format: int64
        dateEnded:
          type: boolean
          description: This report ended the date. False if it had already ended.
        yourRefund:
          type: string
          enum: [REFUNDED, UNDER_REVIEW, NONE]
          description: What happened to the caller's own deposit. `UNDER_REVIEW` means no refund has been issued yet.
      example:
        reportId: 7
        dateEnded: true
        yourRefund: REFUNDED

    RegisterDeviceRequest:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          description: The FCM registration token. A secret; never logged.
        platform:
          type: string
          enum: [IOS, ANDROID]

    RemoveDeviceRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    SafetyDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [UPHELD, NOT_UPHELD, INCONCLUSIVE]
        note:
          type: string

    SafetyBanRequest:
      type: object
      properties:
        note:
          type: string

  responses:
    Unauthorized:
      description: Missing or invalid Firebase token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Unauthorized: Missing or invalid Firebase token"
            status: 401

    Forbidden:
      description: User doesn't have permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Forbidden: Insufficient permissions"
            status: 403

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Resource not found"
            status: 404

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until next batch available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Daily batch limit exceeded"
            status: 429

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: bad_request
            message: Use afterSeq or beforeSeq, not both

    MessageRejected:
      description: The message failed the chat filter (`message_rejected`). The response never repeats the text.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: message_rejected
            message: This message can't be sent

    ChatRateLimited:
      description: Over 30 messages a minute in this chat (`rate_limited`)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next message can be sent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: rate_limited
            message: Too many requests, try again in 12 seconds

paths:
  /:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns "Hello World!" to verify server is running
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: Hello World!

  /users:
    post:
      tags:
        - User Profiles
      summary: Create new user profile
      description: Creates a new user profile. No role required for initial signup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid input
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: User already exists

  /users/exists:
    get:
      tags:
        - User Profiles
      summary: Check if user profile exists
      description: Checks if the authenticated user has created a profile
      responses:
        '200':
          description: Profile existence status
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags:
        - User Profiles
      summary: Get current user profile
      description: Returns the authenticated user's profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - User Profiles
      summary: Update current user profile
      description: Updates the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid input
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - User Profiles
      summary: Delete user account
      description: Soft deletes the user account (GDPR compliance)
      responses:
        '204':
          description: Account deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/visibility:
    patch:
      tags:
        - User Profiles
      summary: Update profile visibility
      description: Toggle profile status between ACTIVE and SLEEP_MODE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACTIVE, SLEEP_MODE]
      responses:
        '200':
          description: Visibility updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid status
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/id/{id}/public:
    get:
      tags:
        - User Profiles
      summary: Get public profile by ID
      description: Returns another user's public profile (requires access control)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      responses:
        '200':
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/id/{id}/admin:
    patch:
      tags:
        - User Profiles
      summary: Admin update user
      description: Admin endpoint to update user role, ELO, badges, status (ADMIN/EMPLOYEE only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [USER, ADMIN, EMPLOYEE]
                elo:
                  type: integer
                status:
                  type: string
                  enum: [ACTIVE, SLEEP_MODE, BANNED, DELETED]
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me/photos/presigned-url:
    post:
      tags:
        - Photos
      summary: Get presigned S3 upload URL
      description: Step 1 of photo upload - Get presigned URL to upload directly to S3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUrlRequest'
      responses:
        '200':
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          description: Invalid request
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/photos:
    post:
      tags:
        - Photos
      summary: Confirm photo upload
      description: Step 2 of photo upload - Confirm S3 upload and save metadata to database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPhotoRequest'
      responses:
        '201':
          description: Photo saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '400':
          description: Invalid photo key or S3 verification failed
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags:
        - Photos
      summary: List user photos
      description: Get all photos for the authenticated user
      responses:
        '200':
          description: List of user photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Photo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/photos/{photoId}:
    delete:
      tags:
        - Photos
      summary: Delete photo
      description: Delete photo from S3 and database
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Photo deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /city/all:
    get:
      tags:
        - Cities
      summary: List all cities
      description: Get all available cities
      responses:
        '200':
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /city/{id}:
    get:
      tags:
        - Cities
